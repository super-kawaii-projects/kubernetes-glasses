---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-glasses-controller
  namespace: kubernetes-glasses
  labels:
    app.kubernetes.io/name: kubernetes-glasses
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-glasses
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-glasses
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kubernetes-glasses-controller
      containers:
        - name: controller
          image: kubernetes-glasses:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: RUST_LOG
              value: "controller=info"
            - name: CLUSTER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-glasses-controller
  namespace: kubernetes-glasses
  labels:
    app.kubernetes.io/name: kubernetes-glasses
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: kubernetes-glasses
    app.kubernetes.io/component: controller
