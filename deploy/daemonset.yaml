---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubernetes-glasses-daemonset
  namespace: kubernetes-glasses
  labels:
    app.kubernetes.io/name: kubernetes-glasses
    app.kubernetes.io/component: daemonset
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-glasses
      app.kubernetes.io/component: daemonset
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-glasses
        app.kubernetes.io/component: daemonset
    spec:
      serviceAccountName: kubernetes-glasses-daemonset
      # Tolerate all taints so we run on every node (including control-plane)
      tolerations:
        - operator: Exists
      hostNetwork: false
      containers:
        - name: daemonset
          image: kubernetes-glasses:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 9090
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONTROLLER_URL
              value: "ws://kubernetes-glasses-controller.kubernetes-glasses.svc.cluster.local:8080/ws/daemonset"
            - name: KUBELET_PORT
              value: "10250"
            - name: HEALTH_PORT
              value: "9090"
            - name: SYNC_INTERVAL_SECS
              value: "15"
            - name: RUST_LOG
              value: "daemonset=info"
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
